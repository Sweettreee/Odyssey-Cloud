# Temporary check for ADR 0004 "Verification (Step 4)": request a GitHub OIDC token and
# print only the sub, ref, and actor_id claims. The token itself is masked and never printed.
# Delete this file after the check.
name: oidc-claims-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Print sub, ref, actor_id (P1 shape)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(JSON.stringify({ sub: claims.sub, ref: claims.ref, actor_id: claims.actor_id }, null, 2))

  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Print sub, ref, actor_id (P3 shape)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(JSON.stringify({ sub: claims.sub, ref: claims.ref, actor_id: claims.actor_id }, null, 2))
