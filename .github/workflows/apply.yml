name: apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        env:
          TF_VERSION: 1.16.5
          # linux_amd64 line of terraform_1.16.5_SHA256SUMS
          TF_SHA256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
        run: |
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Full ARN with the path: the G2 alert matches requestParameters.roleArn exactly (ADR 0007).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::186972156090:role/bootstrap/pipeline-apply
          role-session-name: ${{ github.run_id }}
          # TEMPORARY (R1 test): expect AccessDenied; revert to ap-northeast-2 in the next PR.
          aws-region: us-east-1

      - name: Apply main
        working-directory: infra/main
        run: terraform init -input=false && terraform apply -input=false -auto-approve
